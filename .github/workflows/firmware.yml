name: firmware

on:
  push:
    paths: ["firmware/**", ".github/workflows/firmware.yml"]
  pull_request:
    paths: ["firmware/**"]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mode:
          - { name: collect, defaults: "sdkconfig.defaults" }
          - { name: infer, defaults: "sdkconfig.defaults;sdkconfig.infer" }
          - { name: qemu-bench, defaults: "sdkconfig.defaults;sdkconfig.qemu" }
    name: build (${{ matrix.mode.name }})
    steps:
      - uses: actions/checkout@v4

      - name: Build with ESP-IDF v5.5
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5
          target: esp32s3
          path: firmware
          command: idf.py -D SDKCONFIG_DEFAULTS="${{ matrix.mode.defaults }}" build

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.mode.name }}-${{ github.sha }}
          path: |
            firmware/build/flash_args
            firmware/build/*.bin
            firmware/build/bootloader/bootloader.bin
            firmware/build/partition_table/partition-table.bin
