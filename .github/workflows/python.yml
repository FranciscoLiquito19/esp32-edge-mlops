name: python

on:
  push:
    paths: ["training/**", "server/**", "tools/**", "firmware/components/**", "firmware/test_host/**",
            ".github/workflows/python.yml"]
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt ruff
      - run: ruff check . && ruff format --check .
      - run: pytest -q

  training:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: training
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: training/requirements.txt
      - run: pip install -r requirements.txt
      - run: ruff check . && ruff format --check .
      # Includes the C/Python parity tests (gcc is on the runner) and the
      # slow end-to-end pipeline run on synthetic images.
      - run: pytest -q
